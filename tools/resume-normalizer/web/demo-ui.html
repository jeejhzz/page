<body>
<header>
  <h1>이력서 표준화 — 브라우저 데모</h1>
  <div class="meta">자유 양식 → A4 규격 이력서 · 파싱 엔진 <b>규칙 기반</b></div>

  <div class="meta" id="supported">.pdf .docx .hwpx .txt .md</div>
</header>
<div class="banner">
  <b>여기 올린 파일은 브라우저 밖으로 나가지 않습니다.</b>
  판독·변환·조판이 전부 이 페이지 안에서 일어납니다. 서버로 전송하지 않습니다.
  다만 데모라 <b>PDF 내려받기는 막혀 있어</b>, 화면 미리보기와 인쇄까지만 됩니다.
  실제 시스템(<code>npm start</code>)은 PDF·CSV·ZIP을 파일로 내려받습니다.

<main>
  <div class="left">
    <label class="drop" id="drop">
      <strong>이력서를 끌어다 놓으세요</strong>

    </div></div>

<!-- 한글 CMap (한국어 PDF 판독에 필요) -->
<script>/*__CMAPS__*/</script>
<!-- 라이브러리 -->
<script>/*__FFLATE__*/</script>
<script>/*__MAMMOTH__*/</script>
<script type="module">/*__PDFWORKER__*/</script>
<script type="module">/*__PDFLIB__*/</script>
<!-- 파싱 코어 (서버와 같은 소스) -->
<script>/*__SHIM__*/</script>

<script>
const core = require('extract-core');
const { parseWithRules } = require('parse-rules');
const { normalize, audit, blind: makeBlind } = require('schema');
const { renderHtml } = require('render');

// pdf.js 는 CMap 을 fetch 로 가져온다. 네트워크가 막힌 환경이라
// 우리 sentinel URL 로 오는 요청만 가로채 내장 데이터를 돌려준다.
const CMAP_BASE = 'https://cmap.local/';
const realFetch = window.fetch.bind(window);
window.fetch = function (input, init) {
  const u = typeof input === 'string' ? input : (input && input.url) || '';
  if (u.startsWith(CMAP_BASE)) {
    const name = decodeURIComponent(u.slice(CMAP_BASE.length));
    const b64 = CMAPS[name];
    if (!b64) return Promise.resolve(new Response(null, { status: 404 }));
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return Promise.resolve(new Response(arr, { status: 200 }));
  }
  return realFetch(input, init);
};

async function pdfToText(buf) {
  const lib = globalThis.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = 'about:blank';   // 워커 생성이 막히면 메인 스레드로 내려간다
  const task = lib.getDocument({
    data: new Uint8Array(buf),
    cMapUrl: CMAP_BASE, cMapPacked: true,
    useWorkerFetch: false, isEvalSupported: false, useSystemFonts: false,
    disableFontFace: true, verbosity: 0,
  });
  const doc = await task.promise;
  const pages = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const content = await page.getTextContent();
    const rows = [];
    for (const it of content.items) {
      if (!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      const w = it.width || 0, h = Math.abs(it.transform[3]) || 10;
      let row = rows.find(r => Math.abs(r.y - y) <= core.LINE_TOL);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, w, h, s: it.str });
    }
    pages.push(core.pageToLines(rows, page.getViewport({ scale: 1 }).width));
    page.cleanup();
  }
  await task.destroy();
  return core.markHeadings(pages);
}

async function hwpxToText(buf) {
  const files = fflate.unzipSync(new Uint8Array(buf));
  const names = Object.keys(files)
    .filter(n => /^Contents\/section\d+\.xml$/i.test(n))
    .sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
  if (!names.length) throw new Error('HWPX 안에서 본문(Contents/section*.xml)을 찾지 못했습니다.');
  const dec = new TextDecoder('utf-8');
  return names.map(n => core.hwpxXmlToText(dec.decode(files[n]))).join('\n\n');
}

async function toText(file) {
  const ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
  const buf = await file.arrayBuffer();
  let raw;
  if (ext === '.pdf') raw = await pdfToText(buf);
  else if (ext === '.docx') raw = core.docxHtmlToText((await mammoth.convertToHtml({ arrayBuffer: buf })).value);
  else if (ext === '.hwpx') raw = await hwpxToText(buf);
  else if (ext === '.txt' || ext === '.md') raw = new TextDecoder('utf-8').decode(buf);
  else if (ext === '.hwp') throw new Error('데모에서는 .hwp(바이너리)를 지원하지 않습니다. HWPX 나 PDF 로 저장해서 넣어주세요.');
  else if (ext === '.doc') throw new Error('.doc(구버전 워드)는 지원하지 않습니다. .docx 나 PDF 로 변환해 주세요.');
  else throw new Error('지원하지 않는 형식: ' + ext);
  return core.assertReadable(core.tidy(raw));
}

const state = { items: [], sel: null, busy: 0 };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

async function handle(files) {
  for (const f of files) {
    const row = { pending: true, file: f.name };
    state.items.push(row); state.busy++; render();
    try {
      const text = await toText(f);
      const data = normalize(parseWithRules(text), { sourceFile: f.name, engine: 'rules' });
      data._meta.warnings = [...new Set([...(data._meta.warnings || []), ...audit(data)])];
      Object.assign(row, { pending: false, id: 'i' + Math.random().toString(36).slice(2), data });
      if (!state.sel) state.sel = row.id;
    } catch (e) {
      Object.assign(row, { pending: false, error: e.message });
    }
    state.busy--; render();
  }
}

function render() {
  const done = state.items.filter(i => i.id);
  $('#count').textContent = state.items.length
    ? `${done.length}건 완료${state.busy ? ' · 변환 중…' : ''}` +
      (state.items.filter(i => i.error).length ? ` · 실패 ${state.items.filter(i => i.error).length}건` : '')
    : '';
  $('#list').innerHTML = state.items.map((it, i) => {
    if (it.pending) return `<li><div class="nm">${esc(it.file)}</div><div class="src">변환 중…</div></li>`;
    if (it.error) return `<li class="err"><div class="nm">${esc(it.file)}</div>
      <span class="tag err">실패</span><div class="msg">${esc(it.error)}</div></li>`;
    const w = (it.data._meta.warnings || []).length;
    return `<li data-i="${i}" class="${state.sel === it.id ? 'sel' : ''}">
      <div class="nm">${esc(it.data.name || '(이름 미확인)')}</div>
      <div class="src">${esc(it.file)}</div>
      ${w ? `<span class="tag warn">검토 ${w}건</span>` : '<span class="tag ok">확인</span>'}</li>`;
  }).join('');
  [...document.querySelectorAll('#list li[data-i]')].forEach(li => {
    li.onclick = () => { state.sel = state.items[+li.dataset.i].id; render(); };
  });
  const it = state.items.find(i => i.id === state.sel);
  if (it) { $('#right').innerHTML = detail(it); bind(it); }
}

const FIELDS = ['name', 'nameEn', 'birth', 'gender', 'phone', 'email', 'address', 'targetRole'];
const field = (k, label, v) =>
  `<div class="f"><label>${label}</label><input id="f_${k}" value="${esc(v || '')}"></div>`;
const rest = d => { const o = JSON.parse(JSON.stringify(d)); FIELDS.forEach(f => delete o[f]); delete o._meta; return o; };

function detail(it) {
  const d = it.data, w = d._meta.warnings || [];
  return `
  <div class="bar">
    <h2>${esc(d.name || '(이름 미확인)')}</h2>
    <span class="count">${esc(it.file)}</span>
    <div class="sp"></div>
    <button id="btnPrint">인쇄 · PDF로 저장</button>
    <button id="btnBlind">블라인드본 보기</button>
  </div>
  ${w.length ? `<div class="warnbox"><b>검토 필요</b> — 자동 변환이 확인을 요청한 항목입니다.
    <ul>${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  <div class="panes">
    <iframe id="prev" title="미리보기"></iframe>
    <div class="form">
      <h3>기본 정보 수정</h3>
      ${field('name', '이름', d.name)}${field('nameEn', '영문 이름', d.nameEn)}
      <div class="row">${field('birth', '생년월일', d.birth)}${field('gender', '성별', d.gender)}</div>
      <div class="row">${field('phone', '연락처', d.phone)}${field('email', '이메일', d.email)}</div>
      ${field('address', '주소', d.address)}${field('targetRole', '지원 직무', d.targetRole)}
      <details><summary>학력·경력 등 전체 데이터 (JSON)</summary>
        <textarea id="fJson">${esc(JSON.stringify(rest(d), null, 2))}</textarea>
        <div class="hint">여기서 고친 내용이 그대로 이력서에 반영됩니다.</div>
      </details>
      <button class="save" id="btnSave">고쳐서 다시 만들기</button>
      <div class="hint" id="saveMsg"></div>
    </div>
  </div>`;
}

function paint(it, blindMode) {
  const html = renderHtml(blindMode ? makeBlind(it.data) : it.data, { blind: blindMode });
  const f = $('#prev');
  f.srcdoc = html;
  it._blind = blindMode;
}

function bind(it) {
  paint(it, false);
  $('#btnBlind').onclick = () => {
    const b = !it._blind;
    paint(it, b);
    $('#btnBlind').textContent = b ? '원본 보기' : '블라인드본 보기';
  };
  $('#btnPrint').onclick = () => {
    try { $('#prev').contentWindow.print(); }
    catch (e) { alert('이 화면에서는 인쇄가 막혀 있습니다. 실제 시스템에서는 PDF 파일로 바로 저장됩니다.'); }
  };
  $('#btnSave').onclick = () => {
    const msg = $('#saveMsg');
    let r;
    try { r = JSON.parse($('#fJson').value); }
    catch (e) { msg.textContent = 'JSON 형식이 올바르지 않습니다: ' + e.message; return; }
    FIELDS.forEach(f => { r[f] = $('#f_' + f).value; });
    const data = normalize(r, { ...it.data._meta, edited: true });
    data._meta.warnings = audit(data);
    it.data = data;
    render();
  };
}

const drop = $('#drop');
['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => handle([...ev.dataTransfer.files]));
$('#picker').addEventListener('change', ev => { handle([...ev.target.files]); ev.target.value = ''; });

// 손에 파일이 없어도 눌러 볼 수 있게 가상 이력서 두 장을 넣어 둔다.

for (const key of Object.keys(SAMPLES)) {
  $('#' + key).onclick = () => {
